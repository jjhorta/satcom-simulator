upstream api {
    server api:8000;
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # ── Landing page (root) ───────────────────────────────────────────────
    location = / {
        root /usr/share/nginx/landing;
        try_files /index.html =404;
    }

    location /privacy {
        root /usr/share/nginx/landing;
        try_files /privacy.html =404;
    }

    location /terms {
        root /usr/share/nginx/landing;
        try_files /terms.html =404;
    }

    # ── Redirect bare path (no trailing slash) ────────────────────────────
    location = /constellation-simulator {
        return 301 /constellation-simulator/;
    }

    # ── API  (/constellation-simulator/api/* → FastAPI /api/*) ───────────
    location /constellation-simulator/api/ {
        proxy_pass         http://api/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large outputs (GIF animations)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── SPA  (/constellation-simulator/* → frontend /*) ──────────────────
    # Trailing slash on proxy_pass strips the location prefix automatically.
    location /constellation-simulator/ {
        proxy_pass         http://frontend/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }



}

